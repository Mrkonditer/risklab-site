<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="RiskLab cycle mark">
  <defs>
    <marker id="rlc-arr" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Arrow 1: Diamond → Square -->
  <path d="M 118 40 Q 138 48 146 68" stroke="#1a1a1a" stroke-width="4.5" fill="none" stroke-linecap="round" marker-end="url(#rlc-arr)"/>
  <!-- Arrow 2: Square → Triangle -->
  <path d="M 165 90 Q 172 118 148 136" stroke="#1a1a1a" stroke-width="4.5" fill="none" stroke-linecap="round" marker-end="url(#rlc-arr)"/>
  <!-- Arrow 3: Triangle → Circle -->
  <path d="M 120 158 Q 100 170 80 153" stroke="#1a1a1a" stroke-width="4.5" fill="none" stroke-linecap="round" marker-end="url(#rlc-arr)"/>
  <!-- Arrow 4: Circle → Hexagon -->
  <path d="M 54 140 Q 40 118 52 91" stroke="#1a1a1a" stroke-width="4.5" fill="none" stroke-linecap="round" marker-end="url(#rlc-arr)"/>
  <!-- Arrow 5: Hexagon → Diamond -->
  <path d="M 41 67 Q 50 44 80 39" stroke="#1a1a1a" stroke-width="4.5" fill="none" stroke-linecap="round" marker-end="url(#rlc-arr)"/>

  <!-- Red Diamond (top) -->
  <polygon points="100,18 120,38 100,58 80,38" fill="#ED1C24"/>
  <!-- Purple Square (upper-right) -->
  <rect x="148" y="70" width="22" height="22" rx="2" fill="#8B24A8"/>
  <!-- Green Triangle (lower-right) -->
  <polygon points="136,124 121,161 151,161" fill="#00A551"/>
  <!-- Blue Circle (lower-left) -->
  <circle cx="64" cy="150" r="14" fill="#0F6FBE"/>
  <!-- Gold Hexagon (upper-left) -->
  <polygon points="41,67 53,74 53,88 41,95 29,88 29,74" fill="#D4A020"/>

  <!-- RISKLAB text -->
  <text x="100" y="105" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="12.5" text-anchor="middle" fill="#1a1a1a" letter-spacing="0.4">RISKLAB</text>
</svg>
