<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 150" role="img" aria-label="RiskLab — Risk Laboratory">
  <defs>
    <marker id="rli-arr" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#ffffff"/>
    </marker>
  </defs>

  <g transform="translate(7,7) scale(0.68)">
    <!-- Arrow 1: Diamond → Square -->
    <path d="M 118 40 Q 138 48 146 68" stroke="#ffffff" stroke-width="4.5" fill="none" stroke-linecap="round" marker-end="url(#rli-arr)"/>
    <!-- Arrow 2: Square → Triangle -->
    <path d="M 165 90 Q 172 118 148 136" stroke="#ffffff" stroke-width="4.5" fill="none" stroke-linecap="round" marker-end="url(#rli-arr)"/>
    <!-- Arrow 3: Triangle → Circle -->
    <path d="M 120 158 Q 100 170 80 153" stroke="#ffffff" stroke-width="4.5" fill="none" stroke-linecap="round" marker-end="url(#rli-arr)"/>
    <!-- Arrow 4: Circle → Hexagon -->
    <path d="M 54 140 Q 40 118 52 91" stroke="#ffffff" stroke-width="4.5" fill="none" stroke-linecap="round" marker-end="url(#rli-arr)"/>
    <!-- Arrow 5: Hexagon → Diamond -->
    <path d="M 41 67 Q 50 44 80 39" stroke="#ffffff" stroke-width="4.5" fill="none" stroke-linecap="round" marker-end="url(#rli-arr)"/>

    <!-- Red Diamond -->
    <polygon points="100,18 120,38 100,58 80,38" fill="#ED1C24"/>
    <!-- Purple Square -->
    <rect x="148" y="70" width="22" height="22" rx="2" fill="#8B24A8"/>
    <!-- Green Triangle -->
    <polygon points="136,124 121,161 151,161" fill="#00A551"/>
    <!-- Blue Circle -->
    <circle cx="64" cy="150" r="14" fill="#0F6FBE"/>
    <!-- Gold Hexagon -->
    <polygon points="41,67 53,74 53,88 41,95 29,88 29,74" fill="#D4A020"/>

    <!-- RISKLAB text -->
    <text x="100" y="105" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="12.5" text-anchor="middle" fill="#ffffff" letter-spacing="0.4">RISKLAB</text>
  </g>

  <text x="150" y="72" font-family="'IBM Plex Sans',Verdana,sans-serif" font-weight="700" font-size="52" letter-spacing="-1.5" fill="#ffffff">RiskLab</text>
  <text x="152" y="104" font-family="'IBM Plex Mono',monospace" font-weight="500" font-size="14.5" letter-spacing="4.2" fill="#9BB0C4">RISK  LABORATORY</text>
</svg>
